AWSTemplateFormatVersion: '2010-09-09'

Parameters:
  SQSName24:
    Type: String
    Default: "smnyl-qa-aws-SQSProcessing24" 

  SNSName24:
    Type: String
    Default: "smnyl-qa-aws-SNSNotifyExtraction24" 


Resources:
  # Crea una cola SQS con configuraciones seguras
  SMNYLQAASQSProcessing24:
    Type: 'AWS::SQS::Queue'
    Properties:
      QueueName: !Ref SQSName24
      VisibilityTimeout: 60
      MessageRetentionPeriod: 86400
 
  # Crea un tema SNS con configuraciones seguras
  SMNYLQAASNSNotifyExtraction24:
    Type: 'AWS::SNS::Topic'
    Properties:
      DisplayName: !Ref SNSName24
      KmsMasterKeyId: alias/aws/sns  # Usa AWS Key Management Service (KMS) para encriptar mensajes del tema

  # Crea una suscripción SNS a la Lambda Comprehend
  SMNYLQAASLambdaComprehend24Subscription:
    Type: 'AWS::SNS::Subscription'
    Properties:
      Protocol: lambda
      TopicArn: !Ref SMNYLQAASNSNotifyExtraction24
      Endpoint: arn:aws:lambda:us-east-1:481448867479:function:smnyl-qa-aws-LambdaComprehed24

  # Crea un disparador desde SQS a la Lambda Textract
  SMNYLQAASQSProcessing24Trigger:
    Type: 'AWS::Lambda::EventSourceMapping'
    Properties:
      BatchSize: 1
      Enabled: true
      EventSourceArn: !GetAtt SMNYLQAASQSProcessing24.Arn
      FunctionName: arn:aws:lambda:us-east-1:481448867479:function:smnyl-qa-aws-LambdaTextract24  # Asegúrate de que coincida con el nombre exacto de tu función Lambda

  # Crea una suscripción SNS a la Lambda Comprehend
  SMNYLQAASLambdaComprehend24Trigger:
    Type: 'AWS::Lambda::Permission'
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: arn:aws:lambda:us-east-1:481448867479:function:smnyl-qa-aws-LambdaComprehed24
      Principal: sns.amazonaws.com
      SourceArn: !Ref SMNYLQAASNSNotifyExtraction24
